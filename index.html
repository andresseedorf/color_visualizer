<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Spaces - Adaptive Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; 
        }
        canvas { display: block; }

        /* UI Containers */
        #ui-container {
            position: absolute;
            top: 20px; left: 20px; color: #fff;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px; border-radius: 8px; border: 1px solid #333;
            pointer-events: auto; display: flex; flex-direction: column; gap: 12px; width: 230px; z-index: 10;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .checkbox-group { display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px; flex-wrap: wrap; }
        label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        input[type="range"], input[type="checkbox"] { cursor: pointer; }

        /* Desktop Navigation Info */
        #info {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: #888;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            display: none; 
        }
        
        body.desktop-mode #info {
            display: block; 
        }

        /* Inspector Mode Cursor */
        body.inspector-mode canvas {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%2300ffff" stroke-width="2"><path d="M2 22l5.5-5.5"/><path d="M2.5 16.5l5 5"/><path d="M12 18.5l-4.5-4.5"/><path d="M17 12l-7.5-7.5"/><path d="M22 2l-5.5 5.5"/><path d="M17 12l4 4-2 2-4-4"/></svg>') 0 24, crosshair !important;
        }

        /* Mobile Specific Overlays */
        #space-indicator {
            position: absolute; top: 20px; right: 20px; color: rgba(255,255,255,0.8);
            font-size: 22px; font-weight: 800; letter-spacing: 2px; text-align: right; z-index: 5; display: none; pointer-events: none;
        }
        .swipe-hint { font-size: 9px; font-weight: 400; color: #0ff; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        #inspector-card {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 380px; background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 14px;
            padding: 14px; display: none; align-items: center; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10; pointer-events: none;
        }
        #inspector-card.active { display: flex; }
        .swatch-box { width: 50px; height: 50px; border-radius: 10px; background-color: #333; border: 2px solid rgba(255,255,255,0.8); flex-shrink: 0; }
        .values-grid { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 3px; width: 100%; font-family: monospace; font-size: 12px; }
        .val-label { color: #888; font-weight: bold; }
        .val-data { color: #fff; text-align: left; }
        .val-data.highlight { color: #0ff; font-weight: bold; }

        /* Desktop Viewport Labels & Panels */
        .viewport-container { position: absolute; bottom: 30px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 5; }
        .viewport-label { color: rgba(255, 255, 255, 0.4); font-size: 28px; font-weight: bold; letter-spacing: 2px; }
        .viewport-inspector-panel { position: absolute; top: 20px; display: none; align-items: center; gap: 10px; pointer-events: none; z-index: 10; transform: translateX(-100%); }
        .viewport-readout-text { font-family: monospace; font-size: 13px; color: #0ff; background: rgba(0,0,0,0.85); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(0,255,255,0.4); white-space: nowrap; }
        .viewport-swatch { 
            width: 32px; 
            height: 32px; 
            min-width: 32px; 
            min-height: 32px; 
            border-radius: 6px; 
            border: 2px solid rgba(255,255,255,0.8); 
            flex-shrink: 0; 
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="control-group" id="desktop-checkboxes">
            <label>Active Spaces (Desktop)</label>
            <div class="checkbox-group">
                <label><input type="checkbox" id="check-rgb" checked> RGB</label>
                <label><input type="checkbox" id="check-hsv" checked> HSV</label>
                <label><input type="checkbox" id="check-hsl" checked> HSL</label>
                <label><input type="checkbox" id="check-cmyk" checked> CMYK</label>
                <label style="text-transform: none;"><input type="checkbox" id="check-lab" checked> Lab</label>
            </div>
        </div>
        <div class="control-group">
            <label><input type="checkbox" id="check-turbulence" checked> Turbulence Mode</label>
        </div>
        <div class="control-group">
            <label for="satSlider">Saturation <span id="satValue">1.0</span></label>
            <input type="range" id="satSlider" min="0.0" max="1.0" step="0.05" value="1.0">
        </div>
        <div class="control-group">
            <label for="hueMinSlider">Hue Min (<span id="hueMinValue">0</span>°)</label>
            <input type="range" id="hueMinSlider" min="0" max="360" step="5" value="0">
        </div>
        <div class="control-group">
            <label for="hueMaxSlider">Hue Max (<span id="hueMaxValue">360</span>°)</label>
            <input type="range" id="hueMaxSlider" min="0" max="360" step="5" value="360">
        </div>
    </div>

    <div id="info">Hover to focus viewport | Left Click: Rotate | Scroll: Zoom | Right Click (Turbulence OFF): Pan</div>

    <!-- Mobile Elements -->
    <div id="space-indicator">
        <div id="active-space-name">RGB</div>
        <div class="swipe-hint">↕ Swipe to Change</div>
    </div>
    <div id="inspector-card">
        <div class="swatch-box" id="ui-swatch"></div>
        <div class="values-grid">
            <div class="val-label">RGB</div><div class="val-data" id="val-rgb">---</div>
            <div class="val-label">HSV</div><div class="val-data" id="val-hsv">---</div>
            <div class="val-label">HSL</div><div class="val-data" id="val-hsl">---</div>
            <div class="val-label">CMYK</div><div class="val-data" id="val-cmyk">---</div>
            <div class="val-label">Lab</div><div class="val-data" id="val-lab">---</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        const isMobile = window.innerWidth <= 768;
        if (isMobile) {
            document.getElementById('space-indicator').style.display = 'block';
            document.getElementById('desktop-checkboxes').style.display = 'none';
        } else {
            document.body.classList.add('desktop-mode');
        }

        // --- MATH HELPERS ---
        function rgbToHsv(r, g, b) {
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max, d = max - min;
            s = max == 0 ? 0 : d / max;
            if (max == min) h = 0; 
            else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [h, s, v];
        }

        function rgbToHsl(r, g, b) {
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max == min) h = s = 0; 
            else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                if (s === 0) h = 0;
                else {
                    switch (max) {
                        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                        case g: h = (b - r) / d + 2; break;
                        case b: h = (r - g) / d + 4; break;
                    }
                    h /= 6;
                }
            }
            return [h, s, l];
        }

        function rgbToCmyk(r, g, b) {
            let k = 1.0 - Math.max(r, g, b);
            if (k === 1.0) return [0, 0, 0, 1];
            let c = (1.0 - r - k) / (1.0 - k);
            let m = (1.0 - g - k) / (1.0 - k);
            let y = (1.0 - b - k) / (1.0 - k);
            return [c, m, y, k];
        }

        function rgbToLab(r, g, b) {
            // Un-compand sRGB to Linear RGB
            let rL = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
            let gL = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
            let bL = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;

            // Linear RGB to CIE XYZ (D65 Illuminant)
            let x = (rL * 0.4124 + gL * 0.3576 + bL * 0.1805) * 100.0;
            let y = (rL * 0.2126 + gL * 0.7152 + bL * 0.0722) * 100.0;
            let z = (rL * 0.0193 + gL * 0.1192 + bL * 0.9505) * 100.0;

            // CIE XYZ to CIE L*a*b*
            let refX = 95.047, refY = 100.000, refZ = 108.883;
            let xR = x / refX, yR = y / refY, zR = z / refZ;

            xR = xR > 0.008856 ? Math.pow(xR, 1/3) : (7.787 * xR) + (16 / 116);
            yR = yR > 0.008856 ? Math.pow(yR, 1/3) : (7.787 * yR) + (16 / 116);
            zR = zR > 0.008856 ? Math.pow(zR, 1/3) : (7.787 * zR) + (16 / 116);

            let L = (116 * yR) - 16;
            let a = 500 * (xR - yR);
            let bVal = 200 * (yR - zR);
            return [L, a, bVal];
        }

        function createLabel(text, nx, ny, nz) {
            const canvas = document.createElement('canvas');
            canvas.width = 768; canvas.height = 256; 
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 64px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.shadowColor = "rgba(0, 0, 0, 1)"; ctx.shadowBlur = 10; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true }));
            
            sprite.position.set(nx, ny, nz);
            sprite.scale.set(0.35, 0.125, 1); 
            
            return sprite;
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.15, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
        const sharedGlowTexture = createGlowTexture();

        function createAxisLines(type) {
            const group = new THREE.Group();
            group.userData = { type: type };
            const mat = new THREE.LineBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.6, depthWrite: false });
            function addLine(p1, p2) { group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...p1), new THREE.Vector3(...p2)]), mat)); }
            
            const labels = [];
            if (type === 'RGB' || type === 'CMYK') {
                const off = 0.6; const blk = [-off, -off, -off];
                addLine(blk, [off, -off, -off]); addLine(blk, [-off, off, -off]); addLine(blk, [-off, -off, off]);
                addLine([-0.55, -0.55, -0.55], [0.55, 0.55, 0.55]);
                labels.push(createLabel(type === 'RGB' ? 'R' : 'C', 0.7, -0.6, -0.6), createLabel(type === 'RGB' ? 'G' : 'M', -0.6, 0.7, -0.6), createLabel(type === 'RGB' ? 'B' : 'Y', -0.6, -0.6, 0.7));
                
                if (type === 'RGB') {
                    labels.push(createLabel('0 (Black)', -0.58, -0.58, -0.58), createLabel('1 (White)', 0.62, 0.62, 0.62), createLabel('Achromatic Axis', -0.75, -0.65, -0.65));
                } else if (type === 'CMYK') {
                    labels.push(createLabel('0 (White)', -0.58, -0.58, -0.58), createLabel('100 (Black / K)', 0.62, 0.62, 0.62), createLabel('Grayscale Axis', -0.75, -0.65, -0.65));
                }
            } else if (type === 'HSV' || type === 'HSL') {
                addLine([-0.8, -0.5, 0], [-0.8, 0.5, 0]); 
                const offY = -0.8; const maxSat = 0.6; addLine([0, offY, 0], [maxSat, offY, 0]);
                const circlePts = [];
                for (let i = 0; i <= 64; i++) {
                    const t = (i / 64) * Math.PI * 2;
                    circlePts.push(new THREE.Vector3(maxSat * Math.cos(t), offY, maxSat * Math.sin(t)));
                }
                group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(circlePts), mat));
                labels.push(createLabel(type === 'HSV' ? 'Value' : 'Lightness', -0.8, 0.6, 0), createLabel('Hue', 0.8, -0.8, 0), createLabel('Saturation', 0.3, -0.8, 0.15));
            } else if (type === 'Lab') {
                addLine([0, -0.5, 0], [0, 0.5, 0]); // L* axis (Y)
                addLine([-0.5, 0, 0], [0.5, 0, 0]); // a* axis (X)
                addLine([0, 0, -0.5], [0, 0, 0.5]); // b* axis (Z)
                labels.push(createLabel('L* (Lightness)', 0, 0.6, 0), createLabel('+a* (Red)', 0.65, 0, 0), createLabel('-a* (Green)', -0.65, 0, 0), createLabel('+b* (Yellow)', 0, 0, 0.65), createLabel('-b* (Blue)', 0, 0, -0.65));
            }
            labels.forEach(l => group.add(l));
            return group;
        }

        // --- RENDERER & DATA SETUP ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        let enableTurbulence = true;
        let currentSpread = 20.0, currentSize = 1.0;
        let currentSatMultiplier = 1.0, currentHueMin = 0.0, currentHueMax = 360.0;
        const size = 30, totalPoints = size * size * size;

        const originalRgb = new Float32Array(totalPoints * 3);
        const colors = new Float32Array(totalPoints * 3);
        const spaces = ['RGB', 'HSV', 'HSL', 'CMYK', 'Lab'];
        
        let views = [];
        let pointCloud, mobilePositions, activeNormalsArray;
        let axisGroups = {};
        let activeSpaceIndex = 0, activeSpace = 'RGB';
        let normalsMap = {};

        function computeCoordinatesForType(type, sat, hMin, hMax) {
            const normals = new Float32Array(totalPoints * 3);
            let idx = 0;
            const hMinRad = hMin / 360.0, hMaxRad = hMax / 360.0;

            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    for (let z = 0; z < size; z++) {
                        const r = x / (size - 1), g = y / (size - 1), b = z / (size - 1);
                        if (sat === 1.0 && type === 'RGB') {
                            originalRgb[idx] = r; originalRgb[idx+1] = g; originalRgb[idx+2] = b;
                        }
                        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                        const effR = lum + (r - lum) * sat, effG = lum + (g - lum) * sat, effB = lum + (b - lum) * sat;
                        
                        const hsl = rgbToHsl(effR, effG, effB);
                        const h = hsl[0];
                        let inSlice = true;
                        if (hMin <= hMax) { if (h < hMinRad || h > hMaxRad) inSlice = false; }
                        else { if (h < hMinRad && h > hMaxRad) inSlice = false; }

                        let nx, ny, nz;
                        if (type === 'RGB') {
                            nx = inSlice ? effR - 0.5 : lum - 0.5;
                            ny = inSlice ? effG - 0.5 : lum - 0.5;
                            nz = inSlice ? effB - 0.5 : lum - 0.5;
                        } else if (type === 'HSV') {
                            const hsv = rgbToHsv(effR, effG, effB);
                            const vMax = Math.max(effR, effG, effB);
                            const angle = hsv[0] * Math.PI * 2, radius = hsv[1] * vMax * 0.6;
                            nx = inSlice ? radius * Math.cos(angle) : 0;
                            ny = inSlice ? vMax - 0.5 : -0.5;
                            nz = inSlice ? radius * Math.sin(angle) : 0;
                        } else if (type === 'HSL') {
                            const angle = hsl[0] * Math.PI * 2, radius = hsl[1] * (1.0 - Math.abs(2.0 * hsl[2] - 1.0)) * 0.6;
                            nx = inSlice ? radius * Math.cos(angle) : 0;
                            ny = inSlice ? hsl[2] - 0.5 : -0.5;
                            nz = inSlice ? radius * Math.sin(angle) : 0;
                        } else if (type === 'CMYK') {
                            nx = inSlice ? (1.0 - effR) - 0.5 : (1.0 - lum) - 0.5;
                            ny = inSlice ? (1.0 - effG) - 0.5 : (1.0 - lum) - 0.5;
                            nz = inSlice ? (1.0 - effB) - 0.5 : (1.0 - lum) - 0.5;
                        } else if (type === 'Lab') {
                            const lab = rgbToLab(effR, effG, effB);
                            nx = inSlice ? lab[1] / 256.0 : 0;
                            ny = inSlice ? (lab[0] / 100.0) - 0.5 : -0.5;
                            nz = inSlice ? lab[2] / 256.0 : 0;
                        }

                        normals[idx] = nx; normals[idx+1] = ny; normals[idx+2] = nz;
                        if (type === 'RGB') { colors[idx] = effR; colors[idx+1] = effG; colors[idx+2] = effB; }
                        idx += 3;
                    }
                }
            }
            return normals;
        }

        if (isMobile) {
            // --- MOBILE SETUP ---
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(25, 20, 35);
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05; controls.enablePan = false;

            spaces.forEach(s => normalsMap[s] = computeCoordinatesForType(s, currentSatMultiplier, currentHueMin, currentHueMax));
            activeNormalsArray = normalsMap[activeSpace];

            mobilePositions = new Float32Array(totalPoints * 3);
            for(let i=0; i<totalPoints*3; i++) mobilePositions[i] = activeNormalsArray[i] * 20.0;

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(mobilePositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.computeBoundingSphere(); geometry.boundingSphere.radius = 10000;

            const material = new THREE.PointsMaterial({ size: 1.0, vertexColors: true });
            material.onBeforeCompile = (shader) => {
                shader.fragmentShader = shader.fragmentShader.replace(`vec4 diffuseColor = vec4( diffuse, opacity );`, `vec2 cxy = 2.0 * gl_PointCoord - 1.0; if (dot(cxy, cxy) > 1.0) discard; vec4 diffuseColor = vec4(diffuse, opacity);`);
            };
            pointCloud = new THREE.Points(geometry, material);
            pointCloud.frustumCulled = false; scene.add(pointCloud);

            const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sharedGlowTexture, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthTest: false }));
            glowSprite.visible = false; scene.add(glowSprite);

            spaces.forEach(s => {
                axisGroups[s] = createAxisLines(s);
                scene.add(axisGroups[s]);
                axisGroups[s].visible = (s === activeSpace);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            });

            let mouseX = -1000, mouseY = -1000, isTouching = false;
            window.addEventListener('pointermove', e => { mouseX = (e.clientX/window.innerWidth)*2-1; mouseY = -(e.clientY/window.innerHeight)*2+1; isTouching = true; document.getElementById('inspector-card').classList.add('active'); });
            
            let touchStartY = 0, touchStartX = 0, touchStartTime = 0;
            window.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; touchStartX = e.touches[0].clientX; touchStartTime = Date.now(); }, {passive: true});
            window.addEventListener('touchend', e => {
                const deltaY = e.changedTouches[0].clientY - touchStartY, deltaX = e.changedTouches[0].clientX - touchStartX;
                if (Date.now() - touchStartTime < 500 && Math.abs(deltaY) > 50 && Math.abs(deltaY) > Math.abs(deltaX) * 1.5) {
                    activeSpaceIndex = deltaY > 0 ? (activeSpaceIndex - 1 + spaces.length) % spaces.length : (activeSpaceIndex + 1) % spaces.length;
                    activeSpace = spaces[activeSpaceIndex];
                    activeNormalsArray = normalsMap[activeSpace];
                    document.getElementById('active-space-name').innerText = activeSpace;
                    spaces.forEach(s => axisGroups[s].visible = (s === activeSpace));
                }
                isTouching = false;
            }, {passive: true});

            const raycaster = new THREE.Raycaster();
            const tempVec = new THREE.Vector3();

            function animateMobile() {
                requestAnimationFrame(animateMobile);
                controls.update();

                const targetSpread = enableTurbulence ? 20.0 : 50.0;
                currentSpread += (targetSpread - currentSpread) * 0.1;
                pointCloud.material.size = enableTurbulence ? 1.0 : 0.8;

                const activeGroup = axisGroups[activeSpace];
                activeGroup.scale.set(currentSpread, currentSpread, currentSpread);

                let globalHoveredIdx = -1;
                if (!enableTurbulence && isTouching) {
                    raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);
                    raycaster.params.Points.threshold = currentSpread * 0.03;
                    const intersects = raycaster.intersectObject(pointCloud);
                    if (intersects.length > 0) {
                        globalHoveredIdx = intersects[0].index;
                        const r = originalRgb[globalHoveredIdx*3], g = originalRgb[globalHoveredIdx*3+1], b = originalRgb[globalHoveredIdx*3+2];
                        const lum = 0.2126*r + 0.7152*g + 0.0722*b;
                        const effR = lum + (r - lum)*currentSatMultiplier, effG = lum + (g - lum)*currentSatMultiplier, effB = lum + (b - lum)*currentSatMultiplier;

                        const sR = Math.min(255, Math.max(0, Math.round(effR*255))).toString(16).padStart(2,'0');
                        const sG = Math.min(255, Math.max(0, Math.round(effG*255))).toString(16).padStart(2,'0');
                        const sB = Math.min(255, Math.max(0, Math.round(effB*255))).toString(16).padStart(2,'0');
                        
                        document.getElementById('ui-swatch').style.backgroundColor = `#${sR}${sG}${sB}`;
                        document.getElementById('val-rgb').innerHTML = `${Math.round(effR*255)} ${Math.round(effG*255)} ${Math.round(effB*255)}`;
                        const hsv = rgbToHsv(effR, effG, effB); document.getElementById('val-hsv').innerHTML = `${Math.round(hsv[0]*360)}° ${Math.round(hsv[1]*100)}% ${Math.round(hsv[2]*100)}%`;
                        const hsl = rgbToHsl(effR, effG, effB); document.getElementById('val-hsl').innerHTML = `${Math.round(hsl[0]*360)}° ${Math.round(hsl[1]*100)}% ${Math.round(hsl[2]*100)}%`;
                        const cmyk = rgbToCmyk(effR, effG, effB); document.getElementById('val-cmyk').innerHTML = `${Math.round(cmyk[0]*100)}% ${Math.round(cmyk[1]*100)}% ${Math.round(cmyk[2]*100)}% ${Math.round(cmyk[3]*100)}%`;
                        const lab = rgbToLab(effR, effG, effB); document.getElementById('val-lab').innerHTML = `L*:${Math.round(lab[0])} a*:${Math.round(lab[1])} b*:${Math.round(lab[2])}`;
                        
                        document.querySelectorAll('.val-data').forEach(el => el.classList.remove('highlight'));
                        document.getElementById(`val-${activeSpace.toLowerCase()}`).classList.add('highlight');

                        const pIdx = globalHoveredIdx * 3;
                        glowSprite.material.color.setRGB(effR, effG, effB);
                        glowSprite.position.set(mobilePositions[pIdx], mobilePositions[pIdx+1], mobilePositions[pIdx+2]);
                        glowSprite.scale.set(currentSpread*0.5, currentSpread*0.5, 1);
                        glowSprite.visible = true;
                    }
                } else { glowSprite.visible = false; }

                let localRay = null;
                if (enableTurbulence && isTouching) {
                    raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);
                    localRay = raycaster.ray.clone().applyMatrix4(pointCloud.matrixWorld.clone().invert());
                }

                let hx = 0, hy = 0, hz = 0;
                if (globalHoveredIdx !== -1) {
                    hx = activeNormalsArray[globalHoveredIdx*3]*currentSpread; hy = activeNormalsArray[globalHoveredIdx*3+1]*currentSpread; hz = activeNormalsArray[globalHoveredIdx*3+2]*currentSpread;
                }

                for (let j = 0; j < totalPoints; j++) {
                    const idx = j * 3;
                    let tx = activeNormalsArray[idx]*currentSpread, ty = activeNormalsArray[idx+1]*currentSpread, tz = activeNormalsArray[idx+2]*currentSpread;

                    if (localRay) {
                        tempVec.set(mobilePositions[idx], mobilePositions[idx+1], mobilePositions[idx+2]);
                        const d = localRay.distanceToPoint(tempVec);
                        if (d < currentSpread/6.0) {
                            const f = (currentSpread/6.0 - d)*0.3;
                            mobilePositions[idx] += (Math.random()-0.5)*f; mobilePositions[idx+1] += (Math.random()-0.5)*f; mobilePositions[idx+2] += (Math.random()-0.5)*f;
                        }
                    }

                    if (!enableTurbulence && globalHoveredIdx !== -1 && j !== globalHoveredIdx) {
                        const dx = tx - hx, dy = ty - hy, dz = tz - hz, distSq = dx*dx + dy*dy + dz*dz;
                        if (distSq > 0.0001 && distSq < 225.0) {
                            const dist = Math.sqrt(distSq), f = 10.0 * Math.pow(1.0 - (dist / 15.0), 2.0);
                            tx += (dx / dist)*f; ty += (dy / dist)*f; tz += (dz / dist)*f;
                        }
                    }

                    mobilePositions[idx] += (tx - mobilePositions[idx]) * 0.08;
                    mobilePositions[idx+1] += (ty - mobilePositions[idx+1]) * 0.08;
                    mobilePositions[idx+2] += (tz - mobilePositions[idx+2]) * 0.08;
                }
                pointCloud.geometry.attributes.position.needsUpdate = true;
                renderer.render(scene, camera);
            }
            animateMobile();

        } else {
            // --- DESKTOP SETUP ---
            function createSpaceViewport(type) {
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
                camera.position.set(30, 30, 45);
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true; controls.dampingFactor = 0.05; controls.enablePan = false; controls.enabled = false;

                const normals = computeCoordinatesForType(type, currentSatMultiplier, currentHueMin, currentHueMax);
                const positions = new Float32Array(totalPoints * 3);
                for(let i=0; i<totalPoints*3; i++) positions[i] = normals[i] * 20.0;

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.computeBoundingSphere(); geometry.boundingSphere.radius = 10000;

                const pointMat = new THREE.PointsMaterial({ size: 1.0, vertexColors: true });
                pointMat.onBeforeCompile = (shader) => {
                    shader.fragmentShader = shader.fragmentShader.replace(`vec4 diffuseColor = vec4( diffuse, opacity );`, `vec2 cxy = 2.0 * gl_PointCoord - 1.0; if (dot(cxy, cxy) > 1.0) discard; vec4 diffuseColor = vec4(diffuse, opacity);`);
                };
                const points = new THREE.Points(geometry, pointMat); points.frustumCulled = false; scene.add(points);

                const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sharedGlowTexture, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthTest: false }));
                glowSprite.visible = false; scene.add(glowSprite);

                const axes = createAxisLines(type);
                scene.add(axes);

                const containerDom = document.createElement('div'); containerDom.className = 'viewport-container';
                const labelDom = document.createElement('div'); labelDom.className = 'viewport-label'; labelDom.innerText = type; containerDom.appendChild(labelDom); document.body.appendChild(containerDom);

                const inspectorPanel = document.createElement('div'); inspectorPanel.className = 'viewport-inspector-panel';
                const readoutDom = document.createElement('div'); readoutDom.className = 'viewport-readout-text'; inspectorPanel.appendChild(readoutDom);
                const swatchDom = document.createElement('div'); swatchDom.className = 'viewport-swatch'; inspectorPanel.appendChild(swatchDom);
                document.body.appendChild(inspectorPanel);

                return { type, scene, camera, controls, points, glowSprite, normals, axes, containerDom, inspectorPanel, readoutDom, swatchDom, active: true };
            }

            views = [createSpaceViewport('RGB'), createSpaceViewport('HSV'), createSpaceViewport('HSL'), createSpaceViewport('CMYK'), createSpaceViewport('Lab')];

            document.getElementById('check-rgb').addEventListener('change', e => { views[0].active = e.target.checked; });
            document.getElementById('check-hsv').addEventListener('change', e => { views[1].active = e.target.checked; });
            document.getElementById('check-hsl').addEventListener('change', e => { views[2].active = e.target.checked; });
            document.getElementById('check-cmyk').addEventListener('change', e => { views[3].active = e.target.checked; });
            document.getElementById('check-lab').addEventListener('change', e => { views[4].active = e.target.checked; });

            window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); });

            const raycaster = new THREE.Raycaster();
            const tempVec = new THREE.Vector3();
            let mouseX = -1000, mouseY = -1000, isMouseMoving = false;
            
            window.addEventListener('pointermove', e => {
                mouseX = e.clientX; mouseY = e.clientY; isMouseMoving = true;
                const activeViews = views.filter(v => v.active);
                if (activeViews.length > 0) {
                    const vw = window.innerWidth / activeViews.length;
                    const hIdx = Math.floor(mouseX / vw);
                    activeViews.forEach((v, idx) => v.controls.enabled = (idx === hIdx));
                }
            });
            window.addEventListener('pointerleave', () => { mouseX = -1000; mouseY = -1000; });

            function animateDesktop() {
                requestAnimationFrame(animateDesktop);
                const targetSpread = enableTurbulence ? 20.0 : 50.0;
                currentSpread += (targetSpread - currentSpread) * 0.1;
                currentSize += ((enableTurbulence ? 1.0 : 0.7) - currentSize) * 0.1;

                const activeViews = views.filter(v => v.active);
                views.forEach(v => { v.containerDom.style.display = 'none'; v.inspectorPanel.style.display = 'none'; v.points.material.size = currentSize; });

                if (activeViews.length === 0) { renderer.setViewport(0,0,window.innerWidth,window.innerHeight); renderer.setScissorTest(false); renderer.clear(); return; }

                const vw = window.innerWidth / activeViews.length, vh = window.innerHeight;
                let globalHoverIdx = -1, gR = 0, gG = 0, gB = 0, gEffR = 0, gEffG = 0, gEffB = 0;
                
                let activeViewHovered = null;
                let lX = -1000, lY = -1000;

                if (mouseX >= 0 && mouseX <= window.innerWidth && mouseY >= 0 && mouseY <= window.innerHeight) {
                    const hIdx = Math.floor(mouseX / vw);
                    activeViewHovered = activeViews[hIdx];
                    if (activeViewHovered) {
                        lX = ((mouseX - (hIdx * vw)) / vw) * 2 - 1;
                        lY = -(mouseY / vh) * 2 + 1;
                        raycaster.setFromCamera(new THREE.Vector2(lX, lY), activeViewHovered.camera);
                    }
                }

                if (!enableTurbulence && activeViewHovered) {
                    raycaster.params.Points.threshold = currentSpread * 0.03; 
                    const intersects = raycaster.intersectObject(activeViewHovered.points);
                    if (intersects.length > 0) {
                        globalHoverIdx = intersects[0].index;
                        gR = originalRgb[globalHoverIdx*3]; gG = originalRgb[globalHoverIdx*3+1]; gB = originalRgb[globalHoverIdx*3+2];
                        const lum = 0.2126*gR + 0.7152*gG + 0.0722*gB;
                        gEffR = lum + (gR - lum)*currentSatMultiplier; gEffG = lum + (gG - lum)*currentSatMultiplier; gEffB = lum + (gB - lum)*currentSatMultiplier;
                    }
                }

                activeViews.forEach((v, idx) => {
                    const left = idx * vw, right = left + vw;
                    renderer.setViewport(left, 0, vw, vh); renderer.setScissor(left, 0, vw, vh); renderer.setScissorTest(true);
                    v.camera.aspect = vw / vh; v.camera.updateProjectionMatrix(); v.controls.update();

                    v.containerDom.style.display = 'flex'; v.containerDom.style.left = `${left + (vw / 2)}px`;
                    v.inspectorPanel.style.left = `${right - 20}px`;
                    v.axes.scale.set(currentSpread, currentSpread, currentSpread);

                    const posArr = v.points.geometry.attributes.position.array;

                    let localRay = null;
                    if (enableTurbulence && activeViewHovered === v && isMouseMoving) {
                        localRay = raycaster.ray.clone().applyMatrix4(v.points.matrixWorld.clone().invert());
                    }

                    if (!enableTurbulence && globalHoverIdx !== -1) {
                        let text = '';
                        if (v.type === 'RGB') text = `R: ${Math.round(gEffR*255)} G: ${Math.round(gEffG*255)} B: ${Math.round(gEffB*255)}`;
                        else if (v.type === 'HSV') { const hsv = rgbToHsv(gEffR, gEffG, gEffB); text = `H: ${Math.round(hsv[0]*360)}° S: ${Math.round(hsv[1]*100)}% V: ${Math.round(hsv[2]*100)}%`; }
                        else if (v.type === 'HSL') { const hsl = rgbToHsl(gEffR, gEffG, gEffB); text = `H: ${Math.round(hsl[0]*360)}° S: ${Math.round(hsl[1]*100)}% L: ${Math.round(hsl[2]*100)}%`; }
                        else if (v.type === 'CMYK') { const cmyk = rgbToCmyk(gEffR, gEffG, gEffB); text = `C:${Math.round(cmyk[0]*100)}% M:${Math.round(cmyk[1]*100)}% Y:${Math.round(cmyk[2]*100)}% K:${Math.round(cmyk[3]*100)}%`; }
                        else if (v.type === 'Lab') { const lab = rgbToLab(gEffR, gEffG, gEffB); text = `L*:${Math.round(lab[0])} a*:${Math.round(lab[1])} b*:${Math.round(lab[2])}`; }

                        const sR = Math.min(255, Math.max(0, Math.round(gEffR*255))).toString(16).padStart(2,'0');
                        const sG = Math.min(255, Math.max(0, Math.round(gEffG*255))).toString(16).padStart(2,'0');
                        const sB = Math.min(255, Math.max(0, Math.round(gEffB*255))).toString(16).padStart(2,'0');
                        
                        v.swatchDom.style.backgroundColor = `#${sR}${sG}${sB}`; v.readoutDom.innerText = text; v.inspectorPanel.style.display = 'flex';
                    }

                    let hx = 0, hy = 0, hz = 0;
                    if (globalHoverIdx !== -1) {
                        hx = v.normals[globalHoverIdx*3]*currentSpread; hy = v.normals[globalHoverIdx*3+1]*currentSpread; hz = v.normals[globalHoverIdx*3+2]*currentSpread;
                    }

                    for (let j = 0; j < totalPoints; j++) {
                        const pIdx = j * 3;
                        let tx = v.normals[pIdx]*currentSpread, ty = v.normals[pIdx+1]*currentSpread, tz = v.normals[pIdx+2]*currentSpread;

                        if (localRay) {
                            tempVec.set(posArr[pIdx], posArr[pIdx+1], posArr[pIdx+2]);
                            const distToRay = localRay.distanceToPoint(tempVec);
                            if (distToRay < currentSpread / 6.0) {
                                const f = (currentSpread / 6.0 - distToRay) * 0.3; 
                                posArr[pIdx] += (Math.random() - 0.5) * f;
                                posArr[pIdx+1] += (Math.random() - 0.5) * f;
                                posArr[pIdx+2] += (Math.random() - 0.5) * f;
                            }
                        }

                        if (!enableTurbulence && globalHoverIdx !== -1 && j !== globalHoverIdx) {
                            const dx = tx - hx, dy = ty - hy, dz = tz - hz, distSq = dx*dx + dy*dy + dz*dz;
                            if (distSq > 0.0001 && distSq < 225.0) {
                                const dist = Math.sqrt(distSq), f = 10.0 * Math.pow(1.0 - (dist / 15.0), 2.0);
                                tx += (dx / dist)*f; ty += (dy / dist)*f; tz += (dz / dist)*f;
                            }
                        }
                        
                        posArr[pIdx] += (tx - posArr[pIdx]) * 0.08;
                        posArr[pIdx+1] += (ty - posArr[pIdx+1]) * 0.08;
                        posArr[pIdx+2] += (tz - posArr[pIdx+2]) * 0.08;
                    }
                    v.points.geometry.attributes.position.needsUpdate = true;

                    if (!enableTurbulence && globalHoverIdx !== -1) {
                        const pIdx = globalHoverIdx * 3;
                        v.glowSprite.material.color.setRGB(gEffR, gEffG, gEffB);
                        v.glowSprite.position.set(posArr[pIdx], posArr[pIdx+1], posArr[pIdx+2]);
                        v.glowSprite.scale.set(currentSize*8.0, currentSize*8.0, 1);
                        v.glowSprite.visible = true;
                    } else { v.glowSprite.visible = false; }

                    renderer.render(v.scene, v.camera);
                });
                isMouseMoving = false;
            }
            animateDesktop();
        }

        // --- GLOBAL UI HOOKS ---
        function triggerGlobalUpdate() {
            if (isMobile) {
                spaces.forEach(s => normalsMap[s] = computeCoordinatesForType(s, currentSatMultiplier, currentHueMin, currentHueMax));
                activeNormalsArray = normalsMap[activeSpace];
                pointCloud.geometry.attributes.color.needsUpdate = true;
            } else {
                views.forEach(v => {
                    v.normals = computeCoordinatesForType(v.type, currentSatMultiplier, currentHueMin, currentHueMax);
                    v.points.geometry.attributes.color.needsUpdate = true;
                });
            }
        }

        document.getElementById('check-turbulence').addEventListener('change', e => { 
            enableTurbulence = e.target.checked; 
            
            if(enableTurbulence) document.body.classList.remove('inspector-mode');
            else document.body.classList.add('inspector-mode');
            
            if (isMobile) {
                controls.enablePan = !enableTurbulence;
                if (enableTurbulence) glowSprite.visible = false;
            } else {
                views.forEach(v => {
                    v.controls.enablePan = !enableTurbulence;
                    if(enableTurbulence) v.glowSprite.visible = false;
                });
            }
        });
        
        document.getElementById('satSlider').addEventListener('input', e => { currentSatMultiplier = parseFloat(e.target.value); document.getElementById('satValue').innerText = currentSatMultiplier.toFixed(2); triggerGlobalUpdate(); });
        document.getElementById('hueMinSlider').addEventListener('input', e => { currentHueMin = parseFloat(e.target.value); document.getElementById('hueMinValue').innerText = currentHueMin; triggerGlobalUpdate(); });
        document.getElementById('hueMaxSlider').addEventListener('input', e => { currentHueMax = parseFloat(e.target.value); document.getElementById('hueMaxValue').innerText = currentHueMax; triggerGlobalUpdate(); });
    </script>
</body>
</html>
